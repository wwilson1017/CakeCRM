<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="CakeCRM — the simple CRM. Free, open source, self-hosted, with an AI sales assistant built in.">
  <rect width="1200" height="340" rx="24" fill="#f1f1e8"/>
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="#b07c2e"/>
  <g transform="translate(72,74) scale(2.1)">
  <polygon points="8,26 66,50 66,84 8,60" fill="#fffffa"/><polygon points="66,50 92,26 92,60 66,84" fill="#e8e8dd"/>
  <polygon points="8,26 92,26 66,50" fill="#f1f1e8"/>
  <polygon points="8,26 66,50 66,56 8,32" fill="#b07c2e"/><polygon points="66,50 92,26 92,32 66,56" fill="#b07c2e"/>
