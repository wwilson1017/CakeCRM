[pytest]
testpaths = tests
asyncio_mode = auto
# Integration tests need a real PostgreSQL and are deselected by default so the
# CI "pytest" gate (which provisions no database) stays green. Run them locally /
# in PR evidence with:  python -m pytest -m integration
addopts = -m "not integration" --strict-markers
markers =
    integration: exercises a real PostgreSQL database (deselected from the default no-DB run)
